<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICpEP.SE — Schedule Tracker</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #050505; /* Black theme */
  --panel: #111111;
  --panel-2: #1A1A1A;
  --line: #26262F;
  --text: #F3F3F5;
  --muted: #8A8A96;
  --accent: #FF3385; /* Pink accent */
  --accent-dim: rgba(255, 51, 133, 0.15); /* Glassy pink */
  --ok: #2ED8A7;
  --danger: #FF4A4A;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 32px 24px 60px;
  max-width: 1180px;
  margin: 0 auto;
}

.topline {
  display: flex; justify-content: space-between; align-items: flex-end;
  border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 28px;
  flex-wrap: wrap; gap: 16px;
}
.brand { display: flex; flex-direction: column; gap: 4px; }
.brand .org { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.04em; color: var(--accent); }
.brand h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
.brand .sub { color: var(--muted); font-size: 13px; font-family: 'JetBrains Mono', monospace; }

.status { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); text-align: right; }
.status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 6px; }

.controls { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; align-items: center; }
.chip {
  font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 7px 14px;
  border: 1px solid var(--line); border-radius: 9999px; color: var(--muted); cursor: pointer;
  background: var(--panel); transition: all 0.2s ease;
}
.chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); box-shadow: 0 0 10px rgba(255, 51, 133, 0.2); }
.chip:hover:not(.active) { color: var(--text); background: var(--panel-2); }
.spacer { flex: 1; }
.free-toggle { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; cursor: pointer; }
.free-toggle input { accent-color: var(--accent); cursor: pointer; }

/* Grid */
.grid-wrap {
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
  position: relative; overflow-x: auto;
}
.grid {
  display: grid;
  grid-template-columns: 60px repeat(6, minmax(130px, 1fr));
  grid-template-rows: 40px repeat(26, 30px); /* 40px header, 26 * 30mins = 13 hours */
  min-width: 800px;
}
.cell-border {
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.grid-line {
  grid-column: 1 / -1; border-bottom: 1px dashed var(--line); pointer-events: none;
}
.head {
  background: var(--panel-2); font-family: 'JetBrains Mono', monospace;
  font-size: 13px; color: var(--text); padding-top: 10px; text-align: center;
  border-bottom: 1px solid var(--line);
}
.time-label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted);
  text-align: right; padding-right: 6px; transform: translateY(-6px);
  position: relative; z-index: 10;
}

/* Scheduler Blocks */
.class-block {
  border-radius: 6px; padding: 4px 6px; font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px; line-height: 1.35; overflow: hidden; margin: 1px 2px;
  position: relative; z-index: 5;
  box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  display: flex; flex-direction: column; justify-content: center;
  border: 1px solid rgba(255,255,255,0.1);
  transition: transform 0.2s, z-index 0.2s;
}
.class-block:hover { transform: scale(1.02); z-index: 20; }
.class-block .who { font-weight: 700; font-size: 9.5px; letter-spacing: 0.04em; }
.class-block .subj { font-weight: 500; font-size: 10px; opacity: 0.9; }

/* Accordion Specific */
.accordion-group {
  cursor: pointer; overflow: visible; background: var(--accent-dim); border-color: var(--accent);
}
.accordion-group .who { color: var(--accent); display: flex; align-items: center; justify-content: space-between; }
.accordion-group::after { content: "▼"; font-size: 8px; color: var(--accent); position: absolute; top: 6px; right: 6px; opacity: 0.6; transition: transform 0.2s; }
.accordion-group.expanded::after { transform: rotate(180deg); }
.accordion-content {
  display: none; position: absolute; top: calc(100% + 4px); left: -2px; width: calc(100% + 4px);
  background: var(--panel-2); border: 1px solid var(--accent); border-radius: 6px;
  z-index: 999; box-shadow: 0 10px 20px rgba(0,0,0,0.6); padding: 4px;
  flex-direction: column; gap: 4px; pointer-events: auto;
}
.accordion-group.expanded .accordion-content { display: flex; }
.accordion-group.expanded { z-index: 999; }
.accordion-sub-block {
  border-radius: 4px; padding: 6px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column;
}

/* Legend & Banner */
.legend { display: flex; gap: 18px; margin-top: 20px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--muted); cursor: pointer; transition: color 0.1s; }
.legend-item:hover { color: var(--text); }
.legend-item.active { color: var(--text); font-weight: 700; text-shadow: 0 0 10px rgba(255,255,255,0.4); }
.swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

.overlap-banner {
  margin-top: 20px; padding: 12px 16px; border: 1px solid var(--accent); border-radius: 8px;
  background: var(--accent-dim); font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
  display: flex; align-items: center; gap: 10px; backdrop-filter: blur(8px);
}
.overlap-banner b { color: var(--accent); }

/* Empty state */
.empty-state {
  text-align: center; padding: 80px 20px; grid-column: 1 / -1; grid-row: 2 / -1;
  font-family: 'JetBrains Mono', monospace; color: var(--muted);
  display: flex; flex-direction: column; gap: 12px; align-items: center;
}

/* --- Admin Panel Modal --- */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; justify-content: center; align-items: center; z-index: 9999;
  opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }

.modal-content {
  background: rgba(17, 17, 17, 0.85); border: 1px solid var(--line); border-radius: 16px;
  padding: 32px; width: 440px; max-width: 90vw;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.05);
  transform: translateY(20px) scale(0.95); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex; flex-direction: column; gap: 20px;
}
.modal-overlay.open .modal-content { transform: translateY(0) scale(1); }

.modal-header { font-size: 20px; font-weight: 700; color: var(--text); border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.input-field {
  width: 100%; background: var(--panel-2); border: 1px solid var(--line);
  color: var(--text); padding: 12px 14px; border-radius: 8px; outline: none;
  font-family: 'JetBrains Mono', monospace; font-size: 13px; transition: border 0.2s;
}
.input-field:focus { border-color: var(--accent); }
.modal-btn {
  background: var(--text); color: var(--bg); border: none; padding: 12px; font-size: 14px;
  font-family: 'Space Grotesk', sans-serif; font-weight: 600; border-radius: 8px; cursor: pointer;
  transition: transform 0.1s, filter 0.2s; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px;
}
.modal-btn:hover { filter: brightness(0.9); }
.modal-btn:active { transform: scale(0.98); }
.modal-btn.primary { background: linear-gradient(135deg, var(--accent), #B2245D); color: #fff; }
.modal-btn.danger { background: rgba(255, 74, 74, 0.1); color: var(--danger); border: 1px solid var(--danger); }
.modal-btn.danger:hover { background: var(--danger); color: #fff; }

.import-zone {
  border: 1px dashed var(--line); border-radius: 8px; padding: 24px; text-align: center;
  color: var(--muted); font-size: 13px; font-family: 'JetBrains Mono', monospace;
  background: rgba(255,255,255,0.02); transition: border 0.2s, background 0.2s;
  cursor: pointer; position: relative;
}
.import-zone:hover { border-color: var(--accent); background: rgba(255, 51, 133, 0.05); color: var(--text); }
.import-zone input[type="file"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

#admin-login, #admin-dashboard { display: none; }
.active-view { display: flex !important; flex-direction: column; gap: 20px; }
.log { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ok); text-align: center; white-space: pre-line; }
.log.error { color: var(--danger); }

/* Shake effect for wrong password */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.shake { animation: shake 0.3s ease-in-out; }
</style>
</head>
<body>

<div class="topline">
  <div class="brand">
    <span class="org">ICpEP.SE :: UST-LEGAZPI</span>
    <h1>Schedule Tracker</h1>
    <span class="sub" id="term-sub">A.Y. 2026–2027 · Database loading...</span>
  </div>
  <div class="status">
    <span class="dot" id="status-dot"></span><span id="status-text">client loaded</span>
  </div>
</div>

<div class="controls" id="filter-controls">
  <!-- Chips will be generated here -->
</div>

<div class="grid-wrap">
  <div class="grid" id="main-grid">
    <!-- Grid elements generated via JS -->
  </div>
</div>

<div class="legend" id="legend-box">
  <!-- Legend generated here -->
</div>

<div class="overlap-banner" id="overlap-banner" style="display:none;"></div>

<!-- Admin Modal -->
<div class="modal-overlay" id="admin-modal">
  <div class="modal-content">
    <!-- Login Screen -->
    <div id="admin-login" class="active-view">
      <div class="modal-header">Admin Access</div>
      <p style="font-size: 13px; color: var(--muted);">Password required to import schedule data.</p>
      <input type="password" id="admin-pwd" class="input-field" placeholder="Enter password (e.g., cpe2627)" autocomplete="off">
      <button class="modal-btn" onclick="checkPassword()">Unlock Dashboard</button>
    </div>
    
    <!-- Dashboard Screen -->
    <div id="admin-dashboard">
      <div class="modal-header" style="display:flex; justify-content: space-between; align-items:center;">
        Admin Dashboard
        <span style="font-size: 12px; color: var(--muted); cursor:pointer;" onclick="closeAdmin()">✕</span>
      </div>
      <div class="import-zone">
        <input type="file" id="excel-upload" accept=".xlsx, .xls">
        <div id="upload-msg">Click or Drag & Drop .xlsx file here to update schedule dataset</div>
      </div>
      <div class="log" id="admin-log"></div>
      <button class="modal-btn danger" onclick="clearData()">Clear All Local Data</button>
    </div>
  </div>
</div>

<script>
// Core data
let officersMap = {}; // { [id]: { name, codename, committee, color } }
let classBlocks = []; // { officer_id, day, start_time, end_time, subject, term }
let activeCommittee = "All";
let activeOfficer = null;

// DOM Elements
const grid = document.getElementById('main-grid');
const filterControls = document.getElementById('filter-controls');
const legendBox = document.getElementById('legend-box');
const overlapBanner = document.getElementById('overlap-banner');

const TIME_START = 7.0; // 07:00
const TIME_END = 20.0;  // 20:00
const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

// Load data on boot
window.onload = async () => {
  const loadedOfficers = localStorage.getItem('icpep_officers');
  const loadedBlocks = localStorage.getItem('icpep_blocks');
  
  if (loadedOfficers && loadedBlocks) {
    officersMap = JSON.parse(loadedOfficers);
    classBlocks = JSON.parse(loadedBlocks);
    const ts = localStorage.getItem('icpep_sync_time');
    document.getElementById('status-text').innerText = `live · local sync ${ts || 'recently'}`;
    document.getElementById('status-dot').style.background = 'var(--ok)';
    renderApp();
  } else {
    // If no localStorage, try fetching the repo's Excel file as the default schema
    try {
      document.getElementById('status-text').innerText = 'fetching default data...';
      const res = await fetch('./icpep-schedule-tracker-1.0.0.xlsx');
      if (!res.ok) throw new Error('File not found');
      const data = await res.arrayBuffer();
      const workbook = XLSX.read(data);
      processWorkbookData(workbook, false); // false = full overwrite on fresh load
      document.getElementById('status-text').innerText = 'live · default database';
      document.getElementById('status-dot').style.background = 'var(--ok)';
      renderApp();
    } catch (e) {
      console.warn("Failed to load default dataset:", e);
      renderEmpty();
    }
  }
}

// Convert "08:00" string or decimal to float hour (e.g. 7.5 meaning 07:30)
function parseHour(val) {
  if (typeof val === 'number') {
    // Excel time as fraction of a day (e.g. 0.333 = 08:00)
    return val * 24; 
  }
  if (!val) return 0;
  // Handle string like "08:00" or datetime objects if exported as text
  const str = String(val).trim();
  const parts = str.split(':');
  if (parts.length >= 2) {
    return parseInt(parts[0], 10) + parseInt(parts[1], 10) / 60;
  }
  return 0;
}

function hexToRgba(hex, alpha) {
  const c = hex.replace('#', '');
  const r = parseInt(c.substring(0, 2), 16) || 0;
  const g = parseInt(c.substring(2, 4), 16) || 0;
  const b = parseInt(c.substring(4, 6), 16) || 0;
  return `rgba(${r},${g},${b},${alpha})`;
}

// Render entire grid/UI
function renderApp() {
  // Extract unique committees for chips
  const comms = new Set();
  Object.values(officersMap).forEach(o => o.committee && comms.add(o.committee.trim()));
  const committees = Array.from(comms).sort();
  
  // Render filters
  filterControls.innerHTML = `<div class="chip ${activeCommittee === 'All' ? 'active' : ''}" onclick="setFilter('All')">All Officers</div>`;
  committees.forEach(c => {
    filterControls.innerHTML += `<div class="chip ${activeCommittee === c ? 'active' : ''}" onclick="setFilter('${c}')">${c}</div>`;
  });
  filterControls.innerHTML += `<div class="spacer"></div><label class="free-toggle"><input type="checkbox" checked onchange="calcOverlaps(this.checked)"> compute common free slots</label>`;
  
  // Update Term info
  if (classBlocks.length > 0) {
    document.getElementById('term-sub').innerText = `Term: ${classBlocks[0].term} · Local Data`;
  }
  
  // Establish grid matrix
  grid.innerHTML = '<div class="head" style="border-right: 1px solid var(--line);"></div>';
  DAYS.forEach((d, i) => {
    grid.innerHTML += `<div class="head" style="${i!==5 ? 'border-right: 1px solid var(--line);' : ''}">${d}</div>`;
  });
  
  // Base lines and labels
  for(let hour = 7; hour <= 19; hour++) {
    const r = (hour - 7) * 2 + 2; 
    let label = hour > 12 ? `${hour-12}:00 PM` : `${hour}:00 AM`;
    if(hour === 12) label = "12:00 PM";
    
    grid.innerHTML += `<div class="time-label" style="grid-row: ${r}; grid-column: 1;">${label}</div>`;
    grid.innerHTML += `<div class="grid-line" style="grid-row: ${r};"></div>`;
  }
  
  // Filter officers and blocks
  const committeeOfficers = activeCommittee === 'All' 
    ? officersMap 
    : Object.fromEntries(Object.entries(officersMap).filter(([, details]) => details.committee === activeCommittee));
    
  let renderOfficers = committeeOfficers;
  if (activeOfficer && committeeOfficers[activeOfficer]) {
    renderOfficers = { [activeOfficer]: committeeOfficers[activeOfficer] };
  }
  
  const blocks = classBlocks.filter(b => !!renderOfficers[b.officer_id]);

  // Render Legend (Keep showing all committee officers so you can click to switch)
  legendBox.innerHTML = '';
  Object.entries(committeeOfficers).forEach(([id, o]) => {
    const isActive = activeOfficer === id;
    const activeClass = isActive ? 'active' : '';
    legendBox.innerHTML += `<div class="legend-item ${activeClass}" onclick="setFilter('${activeCommittee}', '${id}')"><span class="swatch" style="background:${o.color || 'var(--accent)'};"></span>${o.name} (${o.codename})</div>`;
  });

  if (blocks.length === 0) {
    grid.innerHTML += `<div class="empty-state">No schedule data for ${activeCommittee}.</div>`;
  } else {
    // Group blocks by day
    const dayGroups = {};
    blocks.forEach(b => {
       const o = officersMap[b.officer_id];
       if(!o) return;
       const col = DAYS.indexOf(b.day) + 2; 
       if (col < 2) return;
       const sh = parseHour(b.start_time);
       const eh = parseHour(b.end_time);
       if(sh === 0 || eh === 0 || sh >= eh) return;
       
       b._col = col; b._sh = sh; b._eh = eh; b._o = o;
       if (!dayGroups[b.day]) dayGroups[b.day] = [];
       dayGroups[b.day].push(b);
    });

    Object.values(dayGroups).forEach(rawDayBlocks => {
      // 1. Merge identical classes (same time and subject)
      const identicalGroups = {};
      rawDayBlocks.forEach(b => {
        const key = `${b._sh}-${b._eh}-${b.subject.trim().toLowerCase()}`;
        if (!identicalGroups[key]) identicalGroups[key] = [];
        identicalGroups[key].push(b);
      });
      
      const dayBlocks = Object.values(identicalGroups).map(group => {
        if (group.length === 1) return group[0];
        const first = group[0];
        // If more than 2, maybe say "John, Doe + 2 others", but for now join all names.
        const names = group.map(b => b._o.codename || b._o.name).join(', ');
        return {
          ...first,
          _o: { ...first._o, codename: names, color: '#FF3385' } // Highlight pink for multi-officer classes
        };
      });

      // Sort array by start time
      dayBlocks.sort((a,b) => a._sh - b._sh);
      
      // Cluster intersecting chunks
      let clusters = [];
      let currentCluster = [];
      let maxEnd = -1;

      dayBlocks.forEach(b => {
        if (currentCluster.length === 0) {
          currentCluster.push(b);
          maxEnd = b._eh;
        } else {
          if (b._sh < maxEnd) { // Extends over or intersects
            currentCluster.push(b);
            maxEnd = Math.max(maxEnd, b._eh);
          } else {
            clusters.push(currentCluster);
            currentCluster = [b];
            maxEnd = b._eh;
          }
        }
      });
      if (currentCluster.length > 0) clusters.push(currentCluster);

      // Render clusters to grid
      clusters.forEach(cluster => {
        if (cluster.length === 1) {
          const b = cluster[0];
          const rowStart = Math.round((b._sh - 7) * 2) + 2;
          const rowSpan = Math.round((b._eh - b._sh) * 2);
          const bg = hexToRgba(b._o.color || '#FF3385', 0.2);
          grid.innerHTML += `<div class="class-block" style="grid-column: ${b._col}; grid-row: ${rowStart} / span ${rowSpan}; background: ${bg}; border-color: ${b._o.color};">
            <div class="who" style="color:${b._o.color};">${b._o.codename || b._o.name}</div>
            <div class="subj">${b.subject}</div>
          </div>`;
        } else {
          // Multiple overlapping items = Accordion Group
          let minSh = Math.min(...cluster.map(b => b._sh));
          let maxEh = Math.max(...cluster.map(b => b._eh));
          const rowStart = Math.round((minSh - 7) * 2) + 2;
          const rowSpan = Math.round((maxEh - minSh) * 2);
          const col = cluster[0]._col;
          
          let contentHTML = cluster.map(b => {
            const bg = hexToRgba(b._o.color || '#FF3385', 0.1);
            return `<div class="accordion-sub-block" style="background: ${bg}; border-color: ${b._o.color};">
              <div class="who" style="color:${b._o.color}; flex-shrink:0;">${b._o.codename || b._o.name}</div>
              <div class="subj">${b.subject}</div>
              <div style="font-size:9px; color:var(--muted); margin-top:2px;">${b.start_time} - ${b.end_time}</div>
            </div>`;
          }).join('');

          grid.innerHTML += `<div class="class-block accordion-group" style="grid-column: ${col}; grid-row: ${rowStart} / span ${rowSpan};" onclick="this.classList.toggle('expanded')">
            <div class="who">⚠️ ${cluster.length} Overlaps</div>
            <div class="subj" style="color:var(--text); opacity:0.8;">Click to expand</div>
            <div class="accordion-content" onclick="event.stopPropagation()">
               ${contentHTML}
            </div>
          </div>`;
        }
      });
    });
  }
  
  calcOverlaps(document.querySelector('.free-toggle input').checked, filteredOfficers, blocks);
}

function renderEmpty() {
  grid.innerHTML = '<div class="head" style="grid-column: 1/-1">Upload needed</div><div class="empty-state">No schedule data found.<br>Press <b>Ctrl + I</b> to open admin panel and upload an Excel file.</div>';
  document.getElementById('status-text').innerText = 'offline · no data';
  document.getElementById('status-dot').style.background = 'var(--line)';
}

function setFilter(committee, officer = null) {
  if (officer && activeOfficer === officer) activeOfficer = null; // Toggle off
  else if (officer) activeOfficer = officer;
  else {
     activeCommittee = committee;
     activeOfficer = null;
  }
  renderApp();
}

// Find common free times
function calcOverlaps(enabled, officers = null, activeBlocks = []) {
  if (!enabled || !officers || Object.keys(officers).length <= 1) {
    overlapBanner.style.display = 'none';
    return;
  }
  
  overlapBanner.style.display = 'flex';
  const namesCount = Object.keys(officers).length;
  
  // 13 hours total (07:00 to 20:00) = 26 slots
  const busyGrid = {};
  DAYS.forEach(d => busyGrid[d] = new Array(26).fill(false));
  
  activeBlocks.forEach(b => {
     let sh = parseHour(b.start_time);
     let eh = parseHour(b.end_time);
     if(sh < 7 || eh > 20 || sh >= eh || !busyGrid[b.day]) return; 
     
     let startIdx = Math.max(0, Math.round((sh - 7) * 2));
     let endIdx = Math.min(26, Math.round((eh - 7) * 2));
     
     for(let i=startIdx; i<endIdx; i++) {
        busyGrid[b.day][i] = true;
     }
  });
  
  let freeIntervals = [];
  DAYS.forEach(d => {
    let currentStart = -1;
    for(let i=0; i<26; i++) {
      if(!busyGrid[d][i]) {
         if(currentStart === -1) currentStart = i;
      } else {
         if(currentStart !== -1) {
            freeIntervals.push({ day: d, startIdx: currentStart, endIdx: i });
            currentStart = -1;
         }
      }
    }
    if(currentStart !== -1) freeIntervals.push({ day: d, startIdx: currentStart, endIdx: 26 });
  });
  
  // Filter for intervals >= 1.5 hours (3 slots)
  const substantial = freeIntervals.filter(fi => (fi.endIdx - fi.startIdx) >= 3);
  substantial.sort((a,b) => (b.endIdx - b.startIdx) - (a.endIdx - a.startIdx));
  
  if (substantial.length === 0) {
     overlapBanner.innerHTML = `⨯ <span>No common free block &ge; 1.5 hours found for <b>${namesCount} officers</b>.</span>`;
  } else {
     const formatH = idx => {
        let hr = Math.floor(7 + (idx/2));
        let min = (idx % 2) === 1 ? '30' : '00';
        let ap = hr >= 12 ? 'PM' : 'AM';
        if(hr > 12) hr -= 12;
        if(hr === 0) hr = 12;
        return `${hr}:${min} ${ap}`;
     };
     const topIntervals = substantial.slice(0, 2).map(fi => `${fi.day} ${formatH(fi.startIdx)} - ${formatH(fi.endIdx)}`);
     overlapBanner.innerHTML = `✓ <span>Free time for <b>${activeCommittee}</b>: <span style="color:var(--ok)">${topIntervals.join(' • ')}</span></span>`;
  }
}

// --- Admin Panel Logic ---
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key.toLowerCase() === 'i') {
    e.preventDefault();
    openAdmin();
  }
});

const adminModal = document.getElementById('admin-modal');
const adminLogin = document.getElementById('admin-login');
const adminDashboard = document.getElementById('admin-dashboard');
const adminPwd = document.getElementById('admin-pwd');
const adminLog = document.getElementById('admin-log');
const uploadMsg = document.getElementById('upload-msg');

function openAdmin() {
  adminModal.classList.add('open');
  adminPwd.value = '';
  document.getElementById('excel-upload').value = null; // reset file input
  adminLog.innerText = '';
  adminLogin.classList.add('active-view');
  adminDashboard.classList.remove('active-view');
  setTimeout(() => adminPwd.focus(), 100);
}
function closeAdmin() {
  adminModal.classList.remove('open');
}
function checkPassword() {
  if (adminPwd.value === 'cpe2627') {
    adminLogin.classList.remove('active-view');
    adminDashboard.classList.add('active-view');
  } else {
    adminPwd.parentElement.classList.add('shake');
    setTimeout(() => adminPwd.parentElement.classList.remove('shake'), 300);
  }
}
adminPwd.addEventListener('keyup', (e) => { if (e.key === 'Enter') checkPassword(); });

document.getElementById('excel-upload').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  uploadMsg.innerText = `Parsing ${file.name}...`;
  adminLog.innerText = '';
  
  try {
    const data = await file.arrayBuffer();
    const workbook = XLSX.read(data);
    
    processWorkbookData(workbook, true); // true = merge with existing
    
    let nowStr = new Date().toLocaleTimeString();
    localStorage.setItem('icpep_sync_time', nowStr);
    
    adminLog.className = 'log';
    adminLog.innerText = `✓ Successfully imported local override!`;
    
    setTimeout(() => {
      closeAdmin();
      renderApp();
    }, 1500);

  } catch (err) {
    adminLog.className = 'log error';
    adminLog.innerText = `⨯ Import Failed: ${err.message}`;
    uploadMsg.innerText = 'Upload failed.';
    console.error(err);
  }
});

function processWorkbookData(workbook, isMerge = false) {
    // Process Officers
    const offSheet = workbook.Sheets['Officers'];
    if (!offSheet) throw new Error("Missing 'Officers' sheet");
    const offJson = XLSX.utils.sheet_to_json(offSheet);
    
    const newOfficers = isMerge ? { ...officersMap } : {};
    offJson.forEach(r => {
      if (r.officer_id) {
        const id = String(r.officer_id).trim().toLowerCase();
        // Skip explicitly marked header examples if their ID is something weird, 
        // but since they have real officer IDs (like 'riza'), we just include them.
        newOfficers[id] = {
          name: r.name, codename: r.codename, committee: r.committee, color: r.color
        };
      }
    });

    // Process ClassBlocks
    const blockSheet = workbook.Sheets['ClassBlocks'];
    if (!blockSheet) throw new Error("Missing 'ClassBlocks' sheet");
    const blockJson = XLSX.utils.sheet_to_json(blockSheet, {raw: true}); 
    
    // Find which IDs are being uploaded so we can clear their old blocks if merging
    const uploadedIds = new Set();
    blockJson.forEach(r => {
       if (r.officer_id) uploadedIds.add(String(r.officer_id).trim().toLowerCase());
    });
    
    // Keep exact old blocks for people NOT in this upload
    let newBlocks = isMerge ? classBlocks.filter(b => !uploadedIds.has(b.officer_id.toLowerCase())) : [];
    
    blockJson.forEach((r, idx) => {
      if (r.officer_id && r.day && r.subject) {
        newBlocks.push({
          officer_id: String(r.officer_id).trim().toLowerCase(),
          day: r.day.trim(),
          start_time: r.start_time,
          end_time: r.end_time,
          subject: String(r.subject).trim(),
          term: r.term
        });
      }
    });
    
    // Save to globals (and storage via manual trigger)
    officersMap = newOfficers;
    classBlocks = newBlocks;
    
    localStorage.setItem('icpep_officers', JSON.stringify(newOfficers));
    localStorage.setItem('icpep_blocks', JSON.stringify(newBlocks));
}

function clearData() {
  if(confirm('Are you sure you want to clear all loaded data? This cannot be undone.')) {
    localStorage.removeItem('icpep_officers');
    localStorage.removeItem('icpep_blocks');
    localStorage.removeItem('icpep_sync_time');
    officersMap = {}; classBlocks = [];
    adminLog.innerText = 'Data cleared.';
    setTimeout(() => { closeAdmin(); renderEmpty(); }, 1000);
  }
}
</script>
