<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICpEP.SE — Schedule Tracker</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

/* ── Design Tokens ─────────────────────────────── */
:root {
  --bg: #06060F;
  --panel: rgba(18, 18, 28, 0.55);
  --panel-2: rgba(28, 28, 42, 0.70);
  --line: rgba(255, 255, 255, 0.07);
  --text: rgba(255, 255, 255, 0.95);
  --muted: rgba(255, 255, 255, 0.45);
  --accent: #FF3385;
  --accent-dim: rgba(255, 51, 133, 0.15);
  --ok: #2ED8A7;
  --danger: #FF4A4A;

  --glass-blur: blur(28px) saturate(160%);
  --glass-border: rgba(255, 255, 255, 0.11);
  --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.14);
  --glass-shadow: 0 32px 80px rgba(0, 0, 0, 0.55);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Body & Atmospheric Background ─────────────── */
html, body {
  min-height: 100vh;
  background: var(--bg);
}

body {
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", 'Space Grotesk', sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 36px 28px 80px;
  max-width: 1200px;
  margin: 0 auto;
  position: relative;
}

/* Grain texture overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 128px 128px;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(ellipse 60% 55% at 8% 6%,  rgba(255, 30, 110, 0.55),  transparent 55%),
    radial-gradient(ellipse 50% 45% at 92% 12%, rgba(100, 80, 255, 0.40),  transparent 55%),
    radial-gradient(ellipse 45% 40% at 50% 92%, rgba(30, 210, 150, 0.22),  transparent 55%),
    radial-gradient(ellipse 35% 30% at 70% 40%, rgba(180, 60, 255, 0.18),  transparent 50%),
    #06060F;
  animation: ambientPulse 14s ease-in-out infinite alternate;
  pointer-events: none;
}

@keyframes ambientPulse {
  from { opacity: 1; }
  to   { opacity: 0.80; }
}

/* ── Header ────────────────────────────────────── */
.topline {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  border-bottom: 1px solid var(--glass-border);
  padding-bottom: 22px;
  margin-bottom: 32px;
  flex-wrap: wrap;
  gap: 16px;
}

.brand { display: flex; flex-direction: column; gap: 5px; }

.brand .org {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--accent);
  text-transform: uppercase;
}

.brand h1 {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(130deg, #fff 45%, rgba(255, 51, 133, 0.85));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.brand .sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--muted);
}

.status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 18px;
  border-radius: 9999px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-highlight);
}

.status .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 8px var(--ok);
  flex-shrink: 0;
}

/* ── Controls ──────────────────────────────────── */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  flex-wrap: wrap;
  align-items: center;
}

.chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  padding: 8px 18px;
  border: 1px solid var(--glass-border);
  border-radius: 9999px;
  color: var(--muted);
  cursor: pointer;
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(12px) saturate(120%);
  -webkit-backdrop-filter: blur(12px) saturate(120%);
  transition: all 180ms ease;
  box-shadow: var(--glass-highlight);
}

.chip:hover:not(.active) {
  color: var(--text);
  border-color: rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.08);
}

.chip.active {
  border-color: rgba(255, 51, 133, 0.50);
  color: var(--accent);
  background: rgba(255, 51, 133, 0.14);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.10),
    0 0 18px rgba(255, 51, 133, 0.12);
}

.chip:active { transform: scale(0.97); }

.spacer { flex: 1; }

.free-toggle {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.free-toggle input { accent-color: var(--accent); cursor: pointer; }

/* ── Grid ──────────────────────────────────────── */
.grid-wrap {
  border: 1px solid rgba(255, 255, 255, 0.13);
  border-radius: 24px;
  background: rgba(14, 10, 24, 0.48);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  position: relative;
  overflow-x: auto;
  overflow-y: hidden;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.14),
    0 0 0 1px rgba(255, 40, 120, 0.10),
    0 32px 80px rgba(0, 0, 0, 0.55),
    0 0 60px rgba(255, 30, 110, 0.08);
}

@supports not (backdrop-filter: blur(1px)) {
  .grid-wrap { background: rgba(18, 18, 28, 0.90); }
}

.grid {
  display: grid;
  grid-template-columns: 60px repeat(6, minmax(130px, 1fr));
  grid-template-rows: 40px 8px repeat(26, 30px); /* header | spacer | 26 × 30min slots */
  min-width: 800px;
}

.cell-border {
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.grid-line {
  grid-column: 1 / -1;
  border-bottom: 1px dashed rgba(255, 255, 255, 0.04);
  pointer-events: none;
}

/* ── Header Cells ──────────────────────────────── */
.head {
  background: rgba(255, 255, 255, 0.03);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text);
  padding-top: 10px;
  text-align: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.10);
}

/* ── Time Labels ───────────────────────────────── */
.time-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  text-align: right;
  padding-right: 8px;
  transform: translateY(-6px);
  position: relative;
  z-index: 10;
}

/* ── Class Blocks ──────────────────────────────── */
.class-block {
  border-radius: 10px;
  padding: 5px 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  line-height: 1.35;
  overflow: hidden;
  margin: 2px 3px;
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  justify-content: center;
  border: 1px solid rgba(255, 255, 255, 0.14);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.18),
    0 4px 20px rgba(0, 0, 0, 0.35);
  transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 200ms ease, z-index 0s;
}

.class-block:hover {
  transform: scale(1.02);
  z-index: 90 !important;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.25),
    0 12px 30px rgba(0, 0, 0, 0.50);
}

.class-block .who {
  font-weight: 700;
  font-size: 9.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.class-block .subj {
  font-weight: 500;
  font-size: 10px;
  opacity: 0.92;
  color: rgba(255,255,255,0.90);
}

/* ── Accordion ─────────────────────────────────── */
.accordion-group {
  cursor: pointer;
  overflow: visible;
  background: rgba(255, 51, 133, 0.14);
  border-color: rgba(255, 51, 133, 0.45);
}

.accordion-group .who {
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.accordion-group::after {
  content: "▼";
  font-size: 8px;
  color: var(--accent);
  position: absolute;
  top: 6px;
  right: 6px;
  opacity: 0.6;
  transition: transform 0.2s;
}

.accordion-group.expanded::after { transform: rotate(180deg); }

.accordion-content {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: -2px;
  width: calc(100% + 4px);
  background: rgba(20, 20, 32, 0.92);
  backdrop-filter: blur(20px) saturate(130%);
  -webkit-backdrop-filter: blur(20px) saturate(130%);
  border: 1px solid rgba(255, 51, 133, 0.35);
  border-radius: 12px;
  z-index: 999;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
  padding: 6px;
  flex-direction: column;
  gap: 4px;
  pointer-events: auto;
}

.accordion-group.expanded .accordion-content { display: flex; }
.accordion-group.expanded { z-index: 999; }

.accordion-sub-block {
  border-radius: 8px;
  padding: 6px;
  border: 1px solid rgba(255,255,255,0.08);
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

/* ── Legend ────────────────────────────────────── */
.legend {
  display: flex;
  gap: 18px;
  margin-top: 24px;
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  color: var(--muted);
  cursor: pointer;
  transition: color 0.15s;
}

.legend-item:hover { color: var(--text); }
.legend-item.active { color: var(--text); font-weight: 700; text-shadow: 0 0 12px rgba(255,255,255,0.35); }
.swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

/* ── Overlap Banner ────────────────────────────── */
.overlap-banner {
  margin-top: 22px;
  padding: 13px 20px;
  border: 1px solid rgba(255, 51, 133, 0.35);
  border-radius: 9999px;
  background: rgba(10, 5, 20, 0.55);
  backdrop-filter: blur(28px) saturate(150%);
  -webkit-backdrop-filter: blur(28px) saturate(150%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.09),
    0 12px 40px rgba(0, 0, 0, 0.35),
    0 0 24px rgba(255, 51, 133, 0.08);
  color: var(--muted);
}

.overlap-banner b { color: var(--accent); }

/* ── Empty State ───────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  grid-column: 1 / -1;
  grid-row: 2 / -1;
  font-family: 'JetBrains Mono', monospace;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}

/* ── Legend controls & grouping ────────────────── */
.legend-header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 32px;
  margin-bottom: 8px;
  grid-column: 1 / -1;
  padding: 0 4px;
}
.legend-toggles {
  display: flex;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  padding: 3px;
  border: 1px solid var(--glass-border);
}
.legend-toggles .leg-btn {
  background: transparent;
  color: var(--muted);
  border: none;
  padding: 5px 12px;
  font-family: inherit;
  font-size: 11px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
}
.legend-toggles .leg-btn.active {
  background: rgba(255,255,255,0.1);
  color: var(--text);
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.legend-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}
.legend-group-title {
  width: 100%;
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  border-bottom: 1px dashed rgba(255,255,255,0.1);
  padding-bottom: 4px;
  margin-top: 8px;
  margin-bottom: 4px;
}
.legend-row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

/* ── Admin Modal ───────────────────────────────── */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(16px) saturate(130%);
  -webkit-backdrop-filter: blur(16px) saturate(130%);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.modal-overlay.open { opacity: 1; pointer-events: auto; }

.modal-content {
  background: rgba(14, 14, 22, 0.80);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 32px;
  width: 440px;
  max-width: 90vw;
  backdrop-filter: blur(32px) saturate(150%);
  -webkit-backdrop-filter: blur(32px) saturate(150%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.10),
    0 28px 60px rgba(0, 0, 0, 0.60);
  transform: translateY(20px) scale(0.95);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.modal-overlay.open .modal-content { transform: translateY(0) scale(1); }

.modal-header {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  border-bottom: 1px solid var(--glass-border);
  padding-bottom: 12px;
}

.input-field {
  width: 100%;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--glass-border);
  color: var(--text);
  padding: 12px 16px;
  border-radius: 14px;
  outline: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  transition: border-color 0.2s, box-shadow 0.2s;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.input-field::placeholder { color: var(--muted); }

.input-field:focus {
  border-color: rgba(255, 51, 133, 0.50);
  box-shadow: 0 0 0 3px rgba(255, 51, 133, 0.12);
}

.modal-btn {
  background: var(--text);
  color: #06060F;
  border: none;
  padding: 13px;
  font-size: 14px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  border-radius: 14px;
  cursor: pointer;
  transition: transform 120ms ease, filter 180ms ease;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
}

.modal-btn:hover { filter: brightness(0.88); }
.modal-btn:active { transform: scale(0.97); }

.modal-btn.primary {
  background: linear-gradient(135deg, var(--accent), #B2245D);
  color: #fff;
}

.modal-btn.danger {
  background: rgba(255, 74, 74, 0.08);
  color: var(--danger);
  border: 1px solid rgba(255, 74, 74, 0.35);
}

.modal-btn.danger:hover {
  background: var(--danger);
  color: #fff;
}

.import-zone {
  border: 1px dashed rgba(255, 255, 255, 0.14);
  border-radius: 16px;
  padding: 28px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
  background: rgba(255, 255, 255, 0.02);
  transition: border-color 0.2s, background 0.2s;
  cursor: pointer;
  position: relative;
}

.import-zone:hover {
  border-color: rgba(255, 51, 133, 0.50);
  background: rgba(255, 51, 133, 0.05);
  color: var(--text);
}

.import-zone input[type="file"] {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}

#admin-login, #admin-dashboard { display: none; }
.active-view { display: flex !important; flex-direction: column; gap: 20px; }

.log {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ok);
  text-align: center;
  white-space: pre-line;
}
.log.error { color: var(--danger); }

/* ── Shake animation ───────────────────────────── */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.shake { animation: shake 0.3s ease-in-out; }

/* ── Compact class block (calendar view) ───────── */
.class-block .cb-inner {
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow: hidden;
  min-width: 0;
}
.class-block .cb-subj {
  font-size: 10px;
  font-weight: 600;
  color: rgba(255,255,255,0.92);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.class-block .cb-dots {
  display: flex;
  gap: 3px;
  flex-wrap: nowrap;
  overflow: hidden;
}
.class-block .cb-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.class-block .cb-time {
  font-size: 8.5px;
  color: rgba(255,255,255,0.50);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Block Popover ─────────────────────────────── */
.block-popover {
  position: fixed;
  z-index: 5000;
  min-width: 220px;
  max-width: 300px;
  background: rgba(10, 8, 20, 0.78);
  backdrop-filter: blur(36px) saturate(180%);
  -webkit-backdrop-filter: blur(36px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 18px;
  padding: 16px 18px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.12),
    0 24px 60px rgba(0,0,0,0.65),
    0 0 0 1px rgba(255,40,120,0.08);
  font-family: 'JetBrains Mono', monospace;
  animation: popIn 200ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  pointer-events: auto;
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.92) translateY(6px); }
  to   { opacity: 1; transform: scale(1)    translateY(0);   }
}
.block-popover .pop-subj {
  font-size: 15px;
  font-weight: 700;
  color: rgba(255,255,255,0.95);
  margin-bottom: 6px;
  line-height: 1.2;
}
.block-popover .pop-time {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 12px;
}
.block-popover .pop-officers {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.block-popover .pop-officer {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: rgba(255,255,255,0.80);
}
.block-popover .pop-officer .pop-swatch {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.block-popover .pop-close {
  position: absolute;
  top: 10px;
  right: 14px;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  line-height: 1;
}
.block-popover .pop-close:hover { color: var(--text); }

/* ── Reduced Motion ────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="topline">
  <div class="brand">
    <span class="org">ICpEP.SE :: UST-LEGAZPI</span>
    <h1>Schedule Tracker</h1>
    <span class="sub" id="term-sub">A.Y. 2026–2027 · Database loading...</span>
  </div>
  <div class="status">
    <span class="dot" id="status-dot"></span><span id="status-text">client loaded</span>
  </div>
</div>

<div class="controls" id="filter-controls">
  <!-- Chips will be generated here -->
</div>

<div class="grid-wrap">
  <div class="grid" id="main-grid">
    <!-- Grid elements generated via JS -->
  </div>
</div>

<div class="legend-header-bar">
  <div style="font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.06em;">Legend</div>
  <div class="legend-toggles">
    <button class="leg-btn" id="btn-grp-com" onclick="setLegendGroup('committee')">By Committee</button>
    <button class="leg-btn" id="btn-grp-yr" onclick="setLegendGroup('year')">By Year Level</button>
  </div>
</div>

<div class="modal-overlay" id="admin-modal">
  <div class="modal-content">
    <!-- Login Screen -->
    <div id="admin-login" class="active-view">
      <div class="modal-header">Admin Access</div>
      <p style="font-size: 13px; color: var(--muted);">Password required to import schedule data.</p>
      <input type="password" id="admin-pwd" class="input-field" placeholder="Enter password" autocomplete="off">
      <button class="modal-btn" onclick="checkPassword()">Unlock Dashboard</button>
    </div>
    
    <!-- Dashboard Screen -->
    <div id="admin-dashboard">
      <div class="modal-header" style="display:flex; justify-content: space-between; align-items:center;">
        Admin Dashboard
        <span style="font-size: 12px; color: var(--muted); cursor:pointer;" onclick="closeAdmin()">✕</span>
      </div>
      <div class="import-zone">
        <input type="file" id="excel-upload" accept=".xlsx, .xls">
        <div id="upload-msg">Click or Drag & Drop .xlsx file here to update schedule dataset</div>

<script>
// Core data
let officersMap = {}; // { [id]: { name, codename, committee, color } }
let classBlocks = []; // { officer_id, day, start_time, end_time, subject, term }
let activeCommittee = "All";
let activeOfficer = null;
let legendGrp = 'committee'; // 'committee' | 'year'

// DOM Elements
const grid = document.getElementById('main-grid');
const filterControls = document.getElementById('filter-controls');
const legendBox = document.getElementById('legend-box');
const overlapBanner = document.getElementById('overlap-banner');

const TIME_START = 7.0; // 07:00
const TIME_END = 20.0;  // 20:00
const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

// Load data on boot
window.onload = async () => {
  const loadedOfficers = localStorage.getItem('icpep_officers');
  const loadedBlocks = localStorage.getItem('icpep_blocks');
  
  if (loadedOfficers && loadedBlocks) {
    officersMap = JSON.parse(loadedOfficers);
    classBlocks = JSON.parse(loadedBlocks);
    const ts = localStorage.getItem('icpep_sync_time');
    document.getElementById('status-text').innerText = `live · local sync ${ts || 'recently'}`;
    document.getElementById('status-dot').style.background = 'var(--ok)';
    renderApp();
  } else {
    // If no localStorage, fetch the repo's Excel file as the default schema
    try {
      document.getElementById('status-text').innerText = 'fetching default data...';
      const res = await fetch('./icpep-schedule-tracker-1.0.3.xlsx');
      if (!res.ok) throw new Error('File not found');
      const data = await res.arrayBuffer();
      const workbook = XLSX.read(data);
      processWorkbookData(workbook, false); // false = full overwrite on fresh load
      document.getElementById('status-text').innerText = 'live · default database';
      document.getElementById('status-dot').style.background = 'var(--ok)';
      renderApp();
    } catch (e) {
      console.warn("Failed to load default dataset:", e);
      renderEmpty();
    }
  }
}

// Convert "08:00" string or decimal to float hour (e.g. 7.5 meaning 07:30)
function parseHour(val) {
  let h = 0;
  if (typeof val === 'number') {
    // Excel time as fraction of a day (e.g. 0.333 = 08:00)
    h = val * 24; 
  } else if (val) {
    // Handle string like "08:00" or datetime objects if exported as text
    const str = String(val).trim();
    const parts = str.split(':');
    if (parts.length >= 2) {
      h = parseInt(parts[0], 10) + parseInt(parts[1], 10) / 60;
    }
  }
  // Auto-correct early morning hours to PM (e.g. 1:30 -> 13.5)
  if (h > 0 && h < 7) {
    h += 12;
  }
  return h;
}

// Format float 7.5 -> "7:30 AM"
function formatHour(h) {
  if (!h) return '';
  let hr = Math.floor(h);
  let min = Math.round((h - hr) * 60);
  let ap = hr >= 12 ? 'PM' : 'AM';
  if (hr > 12) hr -= 12;
  if (hr === 0) hr = 12;
  let minStr = min < 10 ? '0' + min : min;
  return `${hr}:${minStr} ${ap}`;
}

function hexToRgba(hex, alpha) {
  const c = hex.replace('#', '');
  const r = parseInt(c.substring(0, 2), 16) || 0;
  const g = parseInt(c.substring(2, 4), 16) || 0;
  const b = parseInt(c.substring(4, 6), 16) || 0;
  return `rgba(${r},${g},${b},${alpha})`;
}

const COMMITTEE_ORDER = ['Executive', 'Logistics', 'Communications', 'Representatives', 'Committees'];

function setLegendGroup(mode) {
  legendGrp = mode;
  document.getElementById('btn-grp-com').classList.toggle('active', mode === 'committee');
  document.getElementById('btn-grp-yr').classList.toggle('active', mode === 'year');
  renderApp(); // re-render just the legend ideally, but renderApp is fine
}

function inferYearLevel(officerId) {
  const blks = classBlocks.filter(b => b.officer_id === officerId);
  if (!blks.length) return 'Unknown';
  let counts = { 1:0, 2:0, 3:0, 4:0 };
  blks.forEach(b => {
    let m = b.subject.match(/\b([1-4])\d{2}\b/);
    if (m) counts[m[1]]++;
  });
  let maxYr = 'Unknown', maxCnt = 0;
  for (let y=1; y<=4; y++) {
    if (counts[y] > maxCnt) { maxCnt = counts[y]; maxYr = y + ['st','nd','rd','th'][y-1] + ' Year'; }
  }
  return maxYr;
}

// Render entire grid/UI
function renderApp() {
  // Extract unique committees for chips, exclude PHANTOM officers
  const comms = new Set();
  Object.values(officersMap).forEach(o => {
    if (o.codename && o.codename.trim().toUpperCase() === 'PHANTOM') return;
    if (o.committee) comms.add(o.committee.trim());
  });
  // Sort by predefined order, unknown committees go at end alphabetically
  const committees = Array.from(comms).sort((a, b) => {
    const ai = COMMITTEE_ORDER.indexOf(a);
    const bi = COMMITTEE_ORDER.indexOf(b);
    if (ai === -1 && bi === -1) return a.localeCompare(b);
    if (ai === -1) return 1;
    if (bi === -1) return -1;
    return ai - bi;
  });
  
  // Render filters
  filterControls.innerHTML = `<div class="chip ${activeCommittee === 'All' ? 'active' : ''}" onclick="setFilter('All')">All Officers</div>`;
  committees.forEach(c => {
    filterControls.innerHTML += `<div class="chip ${activeCommittee === c ? 'active' : ''}" onclick="setFilter('${c}')">${c}</div>`;
  });
  filterControls.innerHTML += `<div class="spacer"></div><label class="free-toggle"><input type="checkbox" checked onchange="calcOverlaps(this.checked)"> compute common free slots</label>`;
  
  // Update Term info
  if (classBlocks.length > 0) {
    document.getElementById('term-sub').innerText = `Term: ${classBlocks[0].term} · Local Data`;
  }
  
  // Establish grid matrix
  grid.innerHTML = '<div class="head" style="border-right: 1px solid var(--line);"></div>';
  DAYS.forEach((d, i) => {
    grid.innerHTML += `<div class="head" style="${i!==5 ? 'border-right: 1px solid var(--line);' : ''}">${d}</div>`;
  });
  
  // Base lines and labels — row 1=header, row 2=spacer, data starts at row 3
  for(let hour = 7; hour <= 19; hour++) {
    const r = (hour - 7) * 2 + 3; 
    let label = hour > 12 ? `${hour-12}:00 PM` : `${hour}:00 AM`;
    if(hour === 12) label = "12:00 PM";
    
    grid.innerHTML += `<div class="time-label" style="grid-row: ${r}; grid-column: 1;">${label}</div>`;
    grid.innerHTML += `<div class="grid-line" style="grid-row: ${r};"></div>`;
  }
  
  // Filter officers and blocks — exclude PHANTOM
  const isPhantom = ([, o]) => o.codename && o.codename.trim().toUpperCase() === 'PHANTOM';
  const committeeOfficers = Object.fromEntries(
    Object.entries(
      activeCommittee === 'All'
        ? officersMap
        : Object.fromEntries(Object.entries(officersMap).filter(([, d]) => d.committee === activeCommittee))
    ).filter(entry => !isPhantom(entry))
  );

  let renderOfficers = committeeOfficers;
  if (activeOfficer && committeeOfficers[activeOfficer]) {
    renderOfficers = { [activeOfficer]: committeeOfficers[activeOfficer] };
  }
  
  const blocks = classBlocks.filter(b => !!renderOfficers[b.officer_id]);

  // Render Legend (Grouped)
  legendBox.innerHTML = '';
  document.getElementById('btn-grp-com').classList.toggle('active', legendGrp === 'committee');
  document.getElementById('btn-grp-yr').classList.toggle('active', legendGrp === 'year');

  const groups = {};
  Object.entries(committeeOfficers).forEach(([id, o]) => {
    let cat = legendGrp === 'year' ? inferYearLevel(id) : (o.committee || 'Committees');
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push({ id, ...o });
  });

  // Sort categories
  let catKeys = Object.keys(groups);
  if (legendGrp === 'year') {
    catKeys.sort((a,b) => a.localeCompare(b)); // 1st, 2nd, 3rd, 4th, Unknown
  } else {
    catKeys.sort((a,b) => {
      let ai = COMMITTEE_ORDER.indexOf(a), bi = COMMITTEE_ORDER.indexOf(b);
      if (ai === -1 && bi === -1) return a.localeCompare(b);
      if (ai === -1) return 1;
      if (bi === -1) return -1;
      return ai - bi;
    });
  }

  catKeys.forEach(cat => {
    let rowHtml = `<div class="legend-group"><div class="legend-group-title">${cat}</div><div class="legend-row">`;
    // Sort officers alphabetically within group
    groups[cat].sort((a,b) => a.name.localeCompare(b.name)).forEach(o => {
      const isActive = activeOfficer === o.id;
      const activeClass = isActive ? 'active' : '';
      rowHtml += `<div class="legend-item ${activeClass}" onclick="setFilter('${activeCommittee}', '${o.id}')"><span class="swatch" style="background:${o.color || 'var(--accent)'};"></span>${o.name} <span style="opacity:0.6;font-size:0.9em;margin-left:4px;">(${o.codename})</span></div>`;
    });
    rowHtml += `</div></div>`;
    legendBox.innerHTML += rowHtml;
  });

  if (blocks.length === 0) {
    grid.innerHTML += `<div class="empty-state">No schedule data for ${activeCommittee}.</div>`;
  } else {
    // Group blocks by day
    const dayGroups = {};
    blocks.forEach(b => {
       const o = officersMap[b.officer_id];
       if(!o) return;
       const col = DAYS.indexOf(b.day) + 2; 
       if (col < 2) return;
       const sh = parseHour(b.start_time);
       const eh = parseHour(b.end_time);
       if(sh === 0 || eh === 0 || sh >= eh) return;
       
       b._col = col; b._sh = sh; b._eh = eh; b._o = o;
       if (!dayGroups[b.day]) dayGroups[b.day] = [];
       dayGroups[b.day].push(b);
    });

    Object.values(dayGroups).forEach(rawDayBlocks => {
      // 1. Merge identical classes (same time and subject)
      const identicalGroups = {};
      rawDayBlocks.forEach(b => {
        const key = `${b._sh}-${b._eh}-${b.subject.trim().toLowerCase()}`;
        if (!identicalGroups[key]) identicalGroups[key] = [];
        identicalGroups[key].push(b);
      });
      
      const dayBlocks = Object.values(identicalGroups).map(group => {
        if (group.length === 1) return group[0];
        const first = group[0];
        // If more than 2, maybe say "John, Doe + 2 others", but for now join all names.
        const names = group.map(b => b._o.codename || b._o.name).join(', ');
        return {
          ...first,
          _o: { ...first._o, codename: names, color: '#FF3385' } // Highlight pink for multi-officer classes
        };
      });

      // Sort array by start time
      dayBlocks.sort((a,b) => a._sh - b._sh);
      
      // Cluster intersecting chunks
      let clusters = [];
      let currentCluster = [];
      let maxEnd = -1;

      dayBlocks.forEach(b => {
        if (currentCluster.length === 0) {
          currentCluster.push(b);
          maxEnd = b._eh;
        } else {
          if (b._sh < maxEnd) { // Extends over or intersects
            currentCluster.push(b);
            maxEnd = Math.max(maxEnd, b._eh);
          } else {
            clusters.push(currentCluster);
            currentCluster = [b];
            maxEnd = b._eh;
          }
        }
      });
      if (currentCluster.length > 0) clusters.push(currentCluster);

      // Render clusters — compact blocks with popover data
      clusters.forEach(cluster => {
        cluster.forEach((b, i) => {
          const rowStart = Math.round((b._sh - 7) * 2) + 3;
          const rowSpan  = Math.round((b._eh - b._sh) * 2);
          const bg       = hexToRgba(b._o.color || '#FF3385', 0.2);

          let widthStyling = '';
          if (cluster.length > 1) {
            const pct = 100 / cluster.length;
            widthStyling = `width: ${pct}%; margin-left: ${pct * i}%; z-index: ${5 + i};`;
          }

          // Build officer list for this block (merged or single)
          const officers = b._merged
            ? b._merged.map(m => ({ color: m._o.color, codename: m._o.codename || m._o.name, name: m._o.name }))
            : [{ color: b._o.color, codename: b._o.codename || b._o.name, name: b._o.name }];

          const dotsHTML = officers.map(o =>
            `<span class="cb-dot" style="background:${o.color};box-shadow:0 0 4px ${o.color};"></span>`
          ).join('');

          const popData = JSON.stringify({
            subj: b.subject,
            time: `${formatHour(b._sh)} – ${formatHour(b._eh)}`,
            officers
          }).replace(/"/g, '&quot;');

          const blockEl = document.createElement('div');
          blockEl.className = 'class-block';
          blockEl.style.cssText = `grid-column:${b._col}; grid-row:${rowStart}/span ${rowSpan}; background:${bg}; border-color:${b._o.color}; ${widthStyling}`;
          blockEl.dataset.pop = popData;
          blockEl.innerHTML = `
            <div class="cb-inner">
              <div class="cb-subj">${b.subject}</div>
              <div class="cb-dots">${dotsHTML}</div>
              <div class="cb-time">${formatHour(b._sh)} – ${formatHour(b._eh)}</div>
            </div>`;
          blockEl.addEventListener('click', (e) => { e.stopPropagation(); showPopover(blockEl, JSON.parse(blockEl.dataset.pop.replace(/&quot;/g, '"'))); });
          grid.appendChild(blockEl);
        });
      });
    });
  }
  
  calcOverlaps(document.querySelector('.free-toggle input').checked, renderOfficers, blocks);
}

// ── Popover logic ───────────────────────────────
const popover = document.getElementById('block-popover');

function showPopover(el, data) {
  const officersHTML = data.officers.map(o => `
    <div class="pop-officer">
      <span class="pop-swatch" style="background:${o.color};box-shadow:0 0 6px ${o.color};"></span>
      <span>${o.name}${o.codename && o.codename !== o.name ? ' <span style="color:var(--muted);">(' + o.codename + ')</span>' : ''}</span>
    </div>`).join('');

  popover.innerHTML = `
    <span class="pop-close" onclick="closePopover()">✕</span>
    <div class="pop-subj">${data.subj}</div>
    <div class="pop-time">${data.time}</div>
    <div class="pop-officers">${officersHTML}</div>`;

  popover.style.display = 'block';

  // Position: prefer right of element, fall back to left
  const rect = el.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = rect.right + 10;
  let top  = rect.top;

  popover.style.left = '0px'; popover.style.top = '0px'; // reset to measure
  const pw = popover.offsetWidth  || 260;
  const ph = popover.offsetHeight || 160;

  if (left + pw > vw - 12) left = rect.left - pw - 10; // flip left
  if (top  + ph > vh - 12) top  = vh - ph - 12;         // nudge up
  if (left < 8)            left = 8;

  popover.style.left = left + 'px';
  popover.style.top  = Math.max(8, top) + 'px';

  // re-trigger animation
  popover.style.animation = 'none';
  requestAnimationFrame(() => { popover.style.animation = ''; });
}

function closePopover() {
  popover.style.display = 'none';
}

document.addEventListener('click', () => closePopover());

function renderEmpty() {
  grid.innerHTML = '<div class="head" style="grid-column: 1/-1">Upload needed</div><div class="empty-state">No schedule data found.</div>';
  document.getElementById('status-text').innerText = 'offline · no data';
  document.getElementById('status-dot').style.background = 'var(--line)';
}

function setFilter(committee, officer = null) {
  if (officer && activeOfficer === officer) activeOfficer = null; // Toggle off
  else if (officer) activeOfficer = officer;
  else {
     activeCommittee = committee;
     activeOfficer = null;
  }
  renderApp();
}

// Find common free times
function calcOverlaps(enabled, officers = null, activeBlocks = []) {
  if (!enabled || !officers || Object.keys(officers).length <= 1) {
    overlapBanner.style.display = 'none';
    return;
  }
  
  overlapBanner.style.display = 'flex';
  const namesCount = Object.keys(officers).length;
  
  // 13 hours total (07:00 to 20:00) = 26 slots
  const busyGrid = {};
  DAYS.forEach(d => busyGrid[d] = new Array(26).fill(false));
  
  activeBlocks.forEach(b => {
     let sh = parseHour(b.start_time);
     let eh = parseHour(b.end_time);
     if(sh < 7 || eh > 20 || sh >= eh || !busyGrid[b.day]) return; 
     
     let startIdx = Math.max(0, Math.round((sh - 7) * 2));
     let endIdx = Math.min(26, Math.round((eh - 7) * 2));
     
     for(let i=startIdx; i<endIdx; i++) {
        busyGrid[b.day][i] = true;
     }
  });
  
  let freeIntervals = [];
  DAYS.forEach(d => {
    let currentStart = -1;
    for(let i=0; i<26; i++) {
      if(!busyGrid[d][i]) {
         if(currentStart === -1) currentStart = i;
      } else {
         if(currentStart !== -1) {
            freeIntervals.push({ day: d, startIdx: currentStart, endIdx: i });
            currentStart = -1;
         }
      }
    }
    if(currentStart !== -1) freeIntervals.push({ day: d, startIdx: currentStart, endIdx: 26 });
  });
  
  // Filter for intervals >= 1.5 hours (3 slots)
  const substantial = freeIntervals.filter(fi => (fi.endIdx - fi.startIdx) >= 3);
  substantial.sort((a,b) => (b.endIdx - b.startIdx) - (a.endIdx - a.startIdx));
  
  if (substantial.length === 0) {
     overlapBanner.innerHTML = `⨯ <span>No common free block &ge; 1.5 hours found for <b>${namesCount} officers</b>.</span>`;
  } else {
     const formatH = idx => {
        let hr = Math.floor(7 + (idx/2));
        let min = (idx % 2) === 1 ? '30' : '00';
        let ap = hr >= 12 ? 'PM' : 'AM';
        if(hr > 12) hr -= 12;
        if(hr === 0) hr = 12;
        return `${hr}:${min} ${ap}`;
     };
     const topIntervals = substantial.slice(0, 2).map(fi => `${fi.day} ${formatH(fi.startIdx)} - ${formatH(fi.endIdx)}`);
     overlapBanner.innerHTML = `✓ <span>Free time for <b>${activeCommittee}</b>: <span style="color:var(--ok)">${topIntervals.join(' • ')}</span></span>`;
  }
}

// --- Admin Panel Logic ---
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key.toLowerCase() === 'i') {
    e.preventDefault();
    openAdmin();
  }
});

const adminModal = document.getElementById('admin-modal');
const adminLogin = document.getElementById('admin-login');
const adminDashboard = document.getElementById('admin-dashboard');
const adminPwd = document.getElementById('admin-pwd');
const adminLog = document.getElementById('admin-log');
const uploadMsg = document.getElementById('upload-msg');

function openAdmin() {
  adminModal.classList.add('open');
  adminPwd.value = '';
  document.getElementById('excel-upload').value = null; // reset file input
  adminLog.innerText = '';
  adminLogin.classList.add('active-view');
  adminDashboard.classList.remove('active-view');
  setTimeout(() => adminPwd.focus(), 100);
}
function closeAdmin() {
  adminModal.classList.remove('open');
}
function checkPassword() {
  if (adminPwd.value === 'refactorcpe') {
    adminLogin.classList.remove('active-view');
    adminDashboard.classList.add('active-view');
  } else {
    adminPwd.parentElement.classList.add('shake');
    setTimeout(() => adminPwd.parentElement.classList.remove('shake'), 300);
  }
}
adminPwd.addEventListener('keyup', (e) => { if (e.key === 'Enter') checkPassword(); });

document.getElementById('excel-upload').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  uploadMsg.innerText = `Parsing ${file.name}...`;
  adminLog.innerText = '';
  
  try {
    const data = await file.arrayBuffer();
    const workbook = XLSX.read(data);
    
    processWorkbookData(workbook, true); // true = merge with existing
    
    let nowStr = new Date().toLocaleTimeString();
    localStorage.setItem('icpep_sync_time', nowStr);
    
    adminLog.className = 'log';
    adminLog.innerText = `✓ Successfully imported local override!`;
    
    setTimeout(() => {
      closeAdmin();
      renderApp();
    }, 1500);

  } catch (err) {
    adminLog.className = 'log error';
    adminLog.innerText = `⨯ Import Failed: ${err.message}`;
    uploadMsg.innerText = 'Upload failed.';
    console.error(err);
  }
});

function processWorkbookData(workbook, isMerge = false) {
    // Process Officers
    const offSheet = workbook.Sheets['Officers'];
    if (!offSheet) throw new Error("Missing 'Officers' sheet");
    const offJson = XLSX.utils.sheet_to_json(offSheet);
    
    const newOfficers = isMerge ? { ...officersMap } : {};
    offJson.forEach(r => {
      if (r.officer_id) {
        const id = String(r.officer_id).trim().toLowerCase();
        // Skip explicitly marked header examples if their ID is something weird, 
        // but since they have real officer IDs (like 'riza'), we just include them.
        newOfficers[id] = {
          name: r.name, codename: r.codename, committee: r.committee, color: r.color
        };
      }
    });

    // Process ClassBlocks
    const blockSheet = workbook.Sheets['ClassBlocks'];
    if (!blockSheet) throw new Error("Missing 'ClassBlocks' sheet");
    const blockJson = XLSX.utils.sheet_to_json(blockSheet, {raw: true}); 
    
    // Find which IDs are being uploaded so we can clear their old blocks if merging
    const uploadedIds = new Set();
    blockJson.forEach(r => {
       if (r.officer_id) uploadedIds.add(String(r.officer_id).trim().toLowerCase());
    });
    
    // Keep exact old blocks for people NOT in this upload
    let newBlocks = isMerge ? classBlocks.filter(b => !uploadedIds.has(b.officer_id.toLowerCase())) : [];
    
    blockJson.forEach((r, idx) => {
      if (r.officer_id && r.day && r.subject) {
        newBlocks.push({
          officer_id: String(r.officer_id).trim().toLowerCase(),
          day: r.day.trim(),
          start_time: r.start_time,
          end_time: r.end_time,
          subject: String(r.subject).trim(),
          term: r.term
        });
      }
    });
    
    // Save to globals (and storage via manual trigger)
    officersMap = newOfficers;
    classBlocks = newBlocks;
    
    localStorage.setItem('icpep_officers', JSON.stringify(newOfficers));
    localStorage.setItem('icpep_blocks', JSON.stringify(newBlocks));
}

function clearData() {
  if(confirm('Are you sure you want to clear all loaded data? This cannot be undone.')) {
    localStorage.removeItem('icpep_officers');
    localStorage.removeItem('icpep_blocks');
    localStorage.removeItem('icpep_sync_time');
    officersMap = {}; classBlocks = [];
    adminLog.innerText = 'Data cleared.';
    setTimeout(() => { closeAdmin(); renderEmpty(); }, 1000);
  }
}
</script>
